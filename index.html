<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador de Delivery</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-white pb-10">

  <!-- Header principal -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20">
          🛵
        </div>
        <div>
          <h1 class="font-bold text-white text-base tracking-wide leading-none">Cotizador Delivery</h1>
          <span class="text-[10px] text-emerald-400 font-medium">Venezuela • Tasa BCV</span>
        </div>
      </div>
      <a href="presentacion.html" class="text-xs text-slate-400 hover:text-white transition px-3 py-1.5 rounded-lg border border-slate-800 bg-slate-900">
        Web Oficial
      </a>
    </div>
  </header>

  <!-- Contenedor App -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

    <!-- Tarjeta de Tasa BCV -->
    <div class="p-4 rounded-2xl bg-slate-900/80 border border-slate-800 flex items-center justify-between shadow-xl">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🏛️</span>
        <div>
          <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Tasa Oficial BCV</p>
          <p id="tasa-bcv-txt" class="text-lg font-bold text-emerald-400">Cargando...</p>
        </div>
      </div>
      <button onclick="obtenerTasaBCV()" class="p-2 text-slate-400 hover:text-white transition rounded-lg hover:bg-slate-800">
        🔄
      </button>
    </div>

    <!-- Botón directo Google Maps Universal (Compatible con iPhone y Android) -->
    <a href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer" class="w-full py-3 px-4 bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-xl text-center flex items-center justify-center gap-2 shadow-lg shadow-rose-500/20 transition-all active:scale-[0.98]">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      Abrir Google Maps (Ver Ruta Real)
    </a>

    <!-- Formulario de Cotización -->
    <div class="p-5 rounded-2xl bg-slate-900/60 border border-slate-800/80 space-y-4 shadow-xl">
      
      <!-- Campo Distancia -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          📐 Distancia Exacta (Kilómetros km):
        </label>
        <input type="number" id="distancia" placeholder="Ej. 4.6" step="0.1" 
               class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
      </div>

      <!-- Campo Tipo de Carga -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          📦 Tipo de Envío / Carga:
        </label>
        <select id="tipo-envio" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          <option value="estandar">📦 Estándar (Documentos, Comida, Ropa)</option>
          <option value="pesado">🏋️ Carga Pesada / Voluminosa</option>
          <option value="fragil">💎 Objeto Frágil / Delicado</option>
          <option value="nocturno">🌙 Horario Nocturno / Lluvia</option>
        </select>
      </div>

      <!-- Botón Calcular -->
      <button onclick="calcularTarifa()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/10 transition active:scale-[0.98]">
        ⚡ Calcular Tarifa Exacta
      </button>

    </div>

    <!-- Resultado desglosado -->
    <div id="resultado-box" class="hidden p-5 rounded-2xl bg-emerald-950/30 border border-emerald-500/30 space-y-3">
      <h3 class="text-xs uppercase font-bold text-emerald-400 tracking-wider">Resumen de Cotización:</h3>
      <div class="flex justify-between items-baseline">
        <span class="text-slate-300 text-sm">Monto Ref. (USD):</span>
        <span id="res-usd" class="text-2xl font-black text-white">$0.00</span>
      </div>
      <div class="flex justify-between items-baseline border-t border-slate-800 pt-2">
        <span class="text-slate-300 text-sm">Total en Bolívares:</span>
        <span id="res-bs" class="text-xl font-bold text-emerald-400">Bs. 0.00</span>
      </div>
    </div>

    <!-- Botones de Acción (WhatsApp / Copiar) -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button onclick="enviarWhatsApp()" class="py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]">
        💬 WhatsApp
      </button>
      <button onclick="copiarAlPortapapeles()" id="btn-copiar" class="py-3 px-4 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl flex items-center justify-center gap-2 border border-slate-700 transition active:scale-[0.98]">
        📋 Copiar Texto
      </button>
    </div>

  </main>

  <script>
    let tasaBCV = 884.75; 
    const TARIFA_BASE_KM = 0.75; 

    async function obtenerTasaBCV() {
      const el = document.getElementById('tasa-bcv-txt');
      try {
        el.innerText = 'Actualizando...';
        const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
        const data = await res.json();
        if(data && data.promedio) {
          tasaBCV = data.promedio;
          el.innerText = `Bs. ${tasaBCV.toFixed(2)} / USD`;
        }
      } catch (e) {
        el.innerText = `Bs. ${tasaBCV.toFixed(2)} / USD`;
      }
    }

    function calcularTarifa() {
      const dist = parseFloat(document.getElementById('distancia').value);
      if(!dist || dist <= 0) {
        alert("Por favor ingresa una distancia válida en kilómetros.");
        return;
      }

      const tipo = document.getElementById('tipo-envio').value;
      let recargo = 1.0;

      if(tipo === 'pesado') recargo = 1.25;
      if(tipo === 'fragil') recargo = 1.15;
      if(tipo === 'nocturno') recargo = 1.30;

      const totalUSD = (dist * TARIFA_BASE_KM * recargo).toFixed(2
