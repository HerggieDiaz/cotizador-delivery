<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador de Delivery</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
  <style>
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-white pb-10 transition-colors duration-300">

  <!-- Header principal -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/60 backdrop-blur-md sticky top-0 z-50 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20">
          🛵
        </div>
        <div>
          <h1 class="font-bold text-slate-900 dark:text-white text-base tracking-wide leading-none">Cotizador Delivery</h1>
          <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-medium">Venezuela • Tasa BCV</span>
        </div>
      </div>
      
      <!-- Botón Modo Oscuro / Claro -->
      <button onclick="toggleTheme()" class="p-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900" title="Cambiar Tema">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- Contenedor App -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

    <!-- Tarjeta de Tasa BCV y Estado Nocturno -->
    <div class="grid grid-cols-2 gap-3">
      <!-- Tasa BCV con Efecto Pulsante -->
      <div id="card-bcv" class="p-4 rounded-2xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 flex flex-col justify-between shadow-xl animate-pulse">
        <p class="text-[10px] text-slate-500 dark:text-slate-400 uppercase tracking-wider font-semibold">Tasa Oficial BCV</p>
        <p id="tasa-bcv-txt" class="text-base font-bold text-emerald-600 dark:text-emerald-400">Actualizando...</p>
      </div>
      
      <!-- Indicador Automático de Horario Nocturno -->
      <div id="badge-nocturno" class="p-4 rounded-2xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 flex flex-col justify-between shadow-xl hidden">
        <p class="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase tracking-wider font-semibold">Modo Activo</p>
        <p class="text-xs font-bold text-indigo-700 dark:text-indigo-300">🌙 Nocturno (9pm - 6am)</p>
      </div>
    </div>

    <!-- Botón directo Google Maps (Función segura para Android WebView) -->
    <button onclick="abrirGoogleMaps()" class="w-full py-3 px-4 bg-rose-500 hover:bg-rose-600 text-white font-medium rounded-xl text-center flex items-center justify-center gap-2 shadow-lg shadow-rose-500/20 transition-all active:scale-[0.98]">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      Abrir Google Maps (Ver Ruta Real)
    </button>

    <!-- Formulario de Cotización -->
    <div class="p-5 rounded-2xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/80 space-y-4 shadow-xl">
      
      <!-- Campo Link de Google Maps -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
          🔗 Link de Ruta (Google Maps) - Opcional:
        </label>
        <input type="text" id="link-maps" placeholder="Pega aquí el enlace de Google Maps..." 
               class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition text-sm">
      </div>

      <!-- Campo Distancia -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
          📐 Distancia Exacta (Kilómetros km):
        </label>
        <input type="number" id="distancia" placeholder="Ej. 4.6" step="0.1" 
               class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
      </div>

      <!-- Campo Tipo de Carga -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
          📦 Tipo de Envío / Carga:
        </label>
        <select id="tipo-envio" class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
          <option value="estandar">📦 Estándar (Documentos, Comida, Ropa)</option>
          <option value="pesado">🏋️ Carga Pesada / Voluminosa (+25%)</option>
          <option value="fragil">💎 Objeto Frágil / Delicado (+15%)</option>
        </select>
      </div>

      <!-- Botón Calcular -->
      <button onclick="calcularTarifa()" class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/10 transition active:scale-[0.98]">
        ⚡ Calcular Tarifa Exacta
      </button>

    </div>

    <!-- Resultado desglosado -->
    <div id="resultado-box" class="hidden p-5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-500/30 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="text-xs uppercase font-bold text-emerald-600 dark:text-emerald-400 tracking-wider">Resumen de Cotización:</h3>
        <button onclick="reiniciarCotizacion()" class="text-xs px-2.5 py-1 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-600 dark:text-emerald-300 font-semibold rounded-lg transition flex items-center gap-1">
          🔄 Nueva Cotización
        </button>
      </div>
      <div class="flex justify-between items-baseline">
        <span class="text-slate-700 dark:text-slate-300 text-sm">Monto Ref. (USD):</span>
        <span id="res-usd" class="text-2xl font-black text-slate-900 dark:text-white">$0.00</span>
      </div>
      <div class="flex justify-between items-baseline border-t border-slate-200 dark:border-slate-800 pt-2">
        <span class="text-slate-700 dark:text-slate-300 text-sm">Total en Bolívares:</span>
        <span id="res-bs" class="text-xl font-bold text-emerald-600 dark:text-emerald-400">Bs. 0.00</span>
      </div>
    </div>

    <!-- Botones de Acción (WhatsApp y Copiar) -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button onclick="enviarWhatsApp()" class="py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 transition active:scale-[0.98]">
        💬 WhatsApp
      </button>
      <button onclick="copiarAlPortapapeles()" id="btn-copiar" class="py-3 px-4 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-900 dark:text-white font-semibold rounded-xl flex items-center justify-center gap-2 border border-slate-300 dark:border-slate-700 transition active:scale-[0.98]">
        📋 Copiar Texto
      </button>
    </div>

  </main>

  <script>
    let tasaBCV = 88.47; 
    const TARIFA_BASE = 2.00;       
    const KM_BASE = 2.0;            
    const PRECIO_KM_EXTRA = 0.40;   
    let esHorarioNocturno = false;

    // Control de Tema (Modo Claro / Oscuro)
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerText = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        icon.innerText = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    // Cargar preferencia guardada de tema
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const icon = document.getElementById('theme-icon');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        icon.innerText = '🌙';
      } else {
        document.documentElement.classList.add('dark');
        icon.innerText = '☀️';
      }
    })();

    // Verificar si estamos en horario nocturno (9:00 PM a 6:00 AM)
    function verificarHorarioNocturno() {
      const horaActual = new Date().getHours();
      if (horaActual >= 21 || horaActual < 6) {
        esHorarioNocturno = true;
        document.getElementById('badge-nocturno').classList.remove('hidden');
      } else {
        esHorarioNocturno = false;
        document.getElementById('badge-nocturno').classList.add('hidden');
      }
    }

    async function obtenerTasaBCV() {
      const el = document.getElementById('tasa-bcv-txt');
      const card = document.getElementById('card-bcv');
      
      card.classList.add('animate-pulse');

      try {
        el.innerText = 'Actualizando...';
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);

        const res = await fetch('https://ve.dolarapi.com/v1/dolares/oficial', { signal: controller.signal });
        clearTimeout(timeoutId);
        
        const data = await res.json();
        if(data && data.promedio) {
          tasaBCV = data.promedio;
        }
      } catch (e) {
        console.log("Usando tasa de respaldo.");
      }
      
      el.innerText = `Bs. ${tasaBCV.toFixed(2)} / USD`;
      card.classList.remove('animate-pulse');
    }

    function calcularTarifa() {
      const dist = parseFloat(document.getElementById('distancia').value);
      if(!dist || dist <= 0) {
        alert("Por favor ingresa una distancia válida en kilómetros.");
        return;
      }

      let subtotalUSD = TARIFA_BASE;
      if (dist > KM_BASE) {
        const kmAdicionales = dist - KM_BASE;
        subtotalUSD += kmAdicionales * PRECIO_KM_EXTRA;
      }

      const tipo = document.getElementById('tipo-envio').value;
      if(tipo === 'pesado') {
        subtotalUSD *= 1.25; 
      } else if(tipo === 'fragil') {
        subtotalUSD *= 1.15; 
      }

      if(esHorarioNocturno) {
        subtotalUSD *= 1.30;
      }

      const totalUSD = subtotalUSD.toFixed(2);
      const totalBS = (totalUSD * tasaBCV).toFixed(2);

      document.getElementById('res-usd').innerText = `$${totalUSD}`;
      document.getElementById('res-bs').innerText = `Bs. ${totalBS}`;
      document.getElementById('resultado-box').classList.remove('hidden');
      document.getElementById('resultado-box').scrollIntoView({ behavior: 'smooth' });
    }

    function reiniciarCotizacion() {
      document.getElementById('link-maps').value = '';
      document.getElementById('distancia').value = '';
      document.getElementById('tipo-envio').selectedIndex = 0;
      document.getElementById('resultado-box').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function generarTextoPlantilla() {
      const dist = document.getElementById('distancia').value || '0';
      const linkMaps = document.getElementById('link-maps').value.trim();
      const usd = document.getElementById('res-usd').innerText;
      const bs = document.getElementById('res-bs').innerText;

      let texto = `🛵 *COTIZACIÓN DE DELIVERY*\n\n` +
             `📍 *Distancia:* ${dist} km\n`;
             
      if(linkMaps) {
        texto += `🗺️ *Ruta Maps:* ${linkMaps}\n`;
      }

      if(esHorarioNocturno) {
        texto += `🌙 *Tarifa:* Nocturna (9pm - 6am)\n`;
      }

      texto += `💵 *Monto USD:* ${usd}\n` +
               `💳 *Total a pagar:* ${bs}\n` +
               `🏛️ *Tasa BCV:* Bs. ${tasaBCV.toFixed(2)}\n\n` +
               `¡Gracias por preferir nuestro servicio!`;

      return texto;
    }

    // Método infalible para forzar el cambio de ubicación en el WebView de Android hacia Google Maps
    function abrirGoogleMaps() {
      const targetUrl = "https://www.google.com/maps";
      try {
        // En contenedores APK, cambiar directamente el location.href fuerza al WebView a abrir la URL nativamente
        window.location.href = targetUrl;
      } catch (e) {
        window.open(targetUrl, '_blank');
      }
    }

    // Método infalible para forzar la redirección a WhatsApp desde la aplicación instalada
    function enviarWhatsApp() {
      const texto = generarTextoPlantilla();
      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      try {
        // Forzar la navegación directa en la misma instancia del contenedor APK
        window.location.href = url;
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    function copiarAlPortapapeles() {
      const texto = generarTextoPlantilla();
      navigator.clipboard.writeText(texto).then(() => {
        const btn = document.getElementById('btn-copiar');
        btn.innerText = '✓ ¡Copiado!';
        setTimeout(() => btn.innerText = '📋 Copiar Texto', 2000);
      }).catch(err => {
        alert("Copiado manual requerido o no soportado en este entorno.");
      });
    }

    verificarHorarioNocturno();
    obtenerTasaBCV();
  </script>
</body>
</html>
