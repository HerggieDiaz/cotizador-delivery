<!DOCTYPE html>
<html lang="es" class="h-full dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Clientes - Directorio Delivery</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              accent: '#06b6d4'
            }
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="h-full flex justify-center bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-300">

  <!-- Frame Principal de la App (Mobile Viewport) -->
  <main class="w-full max-w-md h-full flex flex-col bg-white dark:bg-slate-900 border-x border-slate-200 dark:border-slate-800 shadow-2xl relative overflow-hidden transition-colors duration-300">

    <!-- Encabezado Superior -->
    <header class="px-5 pt-5 pb-4 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800/80 sticky top-0 z-20 transition-colors duration-300">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2.5">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-accent flex items-center justify-center shadow-lg shadow-brand-500/20">
            <i class="fa-solid fa-bolt text-slate-950 text-xl font-black"></i>
          </div>
          <div>
            <h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5">
              Directorio Delivery
              <span class="text-[10px] bg-brand-500/20 text-brand-600 dark:text-brand-500 border border-brand-500/30 px-1.5 py-0.5 rounded-full font-semibold">CLIENTE</span>
            </h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Repartidores de la flota en línea</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Toggle Modo Claro / Nocturno -->
          <button onclick="toggleTheme()" id="themeBtn" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 flex items-center justify-center border border-slate-200 dark:border-slate-700/60 active:scale-95 transition-all" title="Cambiar Tema">
            <i class="fa-solid fa-moon text-sm hidden dark:block"></i>
            <i class="fa-solid fa-sun text-sm block dark:hidden text-amber-500"></i>
          </button>
          
          <!-- Botón de Sincronización -->
          <button id="refreshBtn" onclick="sincronizarFlota()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-500 flex items-center justify-center border border-slate-200 dark:border-slate-700/60 active:scale-95 transition-all" title="Actualizar Lista">
            <i class="fa-solid fa-rotate-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Filtros de Búsqueda -->
      <div class="space-y-2.5 mt-4">
        <!-- Selector de Zonas -->
        <div class="relative">
          <i class="fa-solid fa-location-dot absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-500 text-sm"></i>
          <select id="zonaSelect" onchange="filtrarRepartidores()" class="w-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 text-sm font-medium rounded-xl pl-9 pr-8 py-2.5 border border-slate-200 dark:border-slate-800 focus:border-brand-500 outline-none appearance-none cursor-pointer transition-colors">
            <option value="todas">Todas las Zonas (Valencia)</option>
            <option value="San Diego">San Diego</option>
            <option value="El Trigal">El Trigal / Prebo</option>
            <option value="Naguanagua">Naguanagua</option>
            <option value="Valencia Norte">Valencia Norte</option>
            <option value="Valencia Sur">Valencia Sur</option>
          </select>
          <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
        </div>

        <!-- Toggle Solo En Línea -->
        <div class="flex items-center justify-between bg-slate-50 dark:bg-slate-950/60 px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800/60 transition-colors">
          <label for="disponiblesToggle" class="text-xs font-medium text-slate-600 dark:text-slate-300 flex items-center gap-2 cursor-pointer">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            Mostrar solo repartidores activos en turno
          </label>
          <input type="checkbox" id="disponiblesToggle" checked onchange="filtrarRepartidores()" class="w-4 h-4 rounded text-brand-500 focus:ring-brand-500 bg-slate-200 dark:bg-slate-900 border-slate-300 dark:border-slate-700 cursor-pointer accent-brand-500">
        </div>
      </div>
    </header>

    <!-- Banner KYC y Seguridad -->
    <section class="mx-4 mt-4 p-3.5 bg-emerald-500/10 dark:bg-gradient-to-r dark:from-emerald-950/40 dark:via-slate-900 dark:to-slate-900 border border-emerald-500/30 rounded-2xl flex items-center space-x-3 shadow-sm shrink-0">
      <div class="w-10 h-10 rounded-xl bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shrink-0">
        <i class="fa-solid fa-user-shield text-lg"></i>
      </div>
      <div class="flex-1">
        <h4 class="text-xs font-bold text-emerald-700 dark:text-emerald-400 flex items-center gap-1">
          Flota Verificada KYC
          <i class="fa-solid fa-circle-check text-[10px]"></i>
        </h4>
        <p class="text-[11px] text-slate-600 dark:text-slate-400 leading-tight mt-0.5">
          Conexión directa con conductores verificados. Sin comisiones extra.
        </p>
      </div>
    </section>

    <!-- Lista de Repartidores Dinámica -->
    <div id="listaRepartidores" class="flex-1 overflow-y-auto px-4 py-4 space-y-3.5">
      <!-- Inyectado por JS -->
    </div>

    <!-- Pie de Página -->
    <footer class="p-3 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 flex items-center justify-between px-6 shrink-0 transition-colors">
      <span class="flex items-center gap-1.5 text-slate-600 dark:text-slate-400 font-medium">
        <i class="fa-solid fa-shield-halved text-brand-500"></i> Red Directa B2B
      </span>
      <span class="text-[11px]">Powered by <b class="text-slate-800 dark:text-slate-300">Herggie Díaz</b></span>
    </footer>

    <!-- MODAL DE CALIFICACIÓN -->
    <div id="ratingModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end justify-center hidden opacity-0 transition-opacity duration-300">
      <div class="w-full max-w-md bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 rounded-t-3xl p-6 shadow-2xl transform translate-y-full transition-transform duration-300" id="ratingModalCard">
        <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-800 rounded-full mx-auto mb-5"></div>
        
        <div class="text-center">
          <div id="modalDriverAvatar" class="w-16 h-16 rounded-full mx-auto mb-3 bg-slate-100 dark:bg-slate-800 border-2 border-brand-500 flex items-center justify-center text-2xl overflow-hidden shadow-lg shadow-brand-500/10 text-slate-800 dark:text-white">
            🛵
          </div>
          <h3 id="modalDriverName" class="text-lg font-bold text-slate-900 dark:text-white">Nombre Repartidor</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mb-4">Califica el servicio de este repartidor</p>

          <!-- Estrellas Interactivas -->
          <div class="flex justify-center gap-2 mb-5" id="starContainer">
            <button onclick="setRating(1)" class="star-btn text-2xl text-slate-300 dark:text-slate-700 hover:scale-110 transition-transform"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(2)" class="star-btn text-2xl text-slate-300 dark:text-slate-700 hover:scale-110 transition-transform"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(3)" class="star-btn text-2xl text-slate-300 dark:text-slate-700 hover:scale-110 transition-transform"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(4)" class="star-btn text-2xl text-slate-300 dark:text-slate-700 hover:scale-110 transition-transform"><i class="fa-solid fa-star"></i></button>
            <button onclick="setRating(5)" class="star-btn text-2xl text-slate-300 dark:text-slate-700 hover:scale-110 transition-transform"><i class="fa-solid fa-star"></i></button>
          </div>

          <!-- Comentario -->
          <textarea id="ratingComment" rows="2" placeholder="Deja una reseña breve (opcional)..." class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl p-3 text-xs text-slate-800 dark:text-slate-200 outline-none focus:border-brand-500 mb-4 resize-none"></textarea>

          <!-- Botones del Modal -->
          <div class="flex gap-3">
            <button onclick="closeRatingModal()" class="flex-1 py-3 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-semibold rounded-xl text-xs transition-colors">
              Cancelar
            </button>
            <button onclick="enviarCalificacionReal()" class="flex-1 py-3 bg-gradient-to-r from-brand-600 to-brand-accent hover:opacity-90 text-slate-950 font-bold rounded-xl text-xs transition-opacity shadow-lg shadow-brand-500/20">
              Enviar Calificación
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-brand-500 text-slate-950 px-4 py-2.5 rounded-full text-xs font-bold shadow-xl flex items-center gap-2 transform -translate-y-20 opacity-0 transition-all duration-300 z-50">
      <i class="fa-solid fa-circle-check"></i>
      <span id="toastMessage">¡Sincronizado!</span>
    </div>

  </main>

  <script>
    let currentRating = 5;
    let selectedDriverId = null;

    // CONTROL DEL MODO CLARO Y OSCURO
    function initTheme() {
      const savedTheme = localStorage.getItem('theme_preference');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme_preference', isDark ? 'dark' : 'light');
    }

    // CONEXIÓN CON LA APP PRO (Obtiene usuarios reales en línea)
    function obtenerRepartidoresFlota() {
      let flota = JSON.parse(localStorage.getItem('flota_repartidores')) || [];

      // Si la flota está vacía, inicializamos con tu perfil Pro real
      if (flota.length === 0) {
        flota = [
          {
            id: "rep_herggie_01",
            nombre: "Herggie Díaz",
            zona: "San Diego",
            vehiculo: "Bera Socialista 150",
            placa: "AB1C23D",
            calificacion: 5.0,
            resenasCount: 15,
            carreras: 120,
            enLinea: true,
            whatsapp: "584120000000",
            avatarIcon: "🛵",
            comentarioDestacado: "Repartidor verificado de la flota principal.",
            esPro: true
          }
        ];
        localStorage.setItem('flota_repartidores', JSON.stringify(flota));
      }

      // Sincronizar sesión activa de la App Pro si existe
      const sesionProActiva = JSON.parse(localStorage.getItem('repartidor_pro_session'));
      if (sesionProActiva) {
        const index = flota.findIndex(r => r.id === sesionProActiva.id);
        if (index !== -1) {
          flota[index] = sesionProActiva;
        } else {
          flota.unshift(sesionProActiva);
        }
      }

      return flota;
    }

    function guardarFlota(flota) {
      localStorage.setItem('flota_repartidores', JSON.stringify(flota));
    }

    // RENDERIZAR REPARTIDORES
    function renderRepartidores(lista) {
      const contenedor = document.getElementById('listaRepartidores');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = `
          <div class="text-center py-12 px-4">
            <div class="w-16 h-16 rounded-2xl bg-slate-200 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-3 text-2xl">
              <i class="fa-solid fa-motorcycle"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300">No hay repartidores disponibles</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">Cuando un repartidor inicie turno en la App Pro, aparecerá en este directorio.</p>
          </div>
        `;
        return;
      }

      lista.forEach(driver => {
        const statusBadge = driver.enLinea 
          ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">
               <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> En Turno
             </span>`
          : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-medium bg-slate-200 dark:bg-slate-800 text-slate-500 border border-slate-300 dark:border-slate-700">
               Desconectado
             </span>`;

        const proBadge = driver.esPro ? `<span class="text-[9px] bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 px-1 rounded font-bold">PRO</span>` : '';

        const mensajeWA = encodeURIComponent(`¡Hola ${driver.nombre}! Vi tu perfil en la App de Clientes. Necesito solicitar un servicio de delivery en la zona de ${driver.zona}. ¿Estás disponible?`);
        const linkWA = `https://wa.me/${driver.whatsapp}?text=${mensajeWA}`;

        const card = document.createElement('div');
        card.className = "bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 transition-all hover:border-slate-300 dark:hover:border-slate-700 shadow-sm dark:shadow-lg relative overflow-hidden group";

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-12 h-12 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 flex items-center justify-center text-2xl relative shrink-0 shadow-inner">
                ${driver.avatarIcon || '🛵'}
                <span class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 border-2 border-white dark:border-slate-900 rounded-full flex items-center justify-center text-[8px] text-slate-950 font-bold" title="KYC Verificado">
                  ✓
                </span>
              </div>
              <div>
                <h3 class="text-sm font-bold text-slate-900 dark:text-white group-hover:text-brand-500 transition-colors flex items-center gap-1.5">
                  ${driver.nombre} ${proBadge}
                </h3>
                <p class="text-[11px] text-slate-500 dark:text-slate-400 flex items-center gap-2 mt-0.5">
                  <span><i class="fa-solid fa-motorcycle text-slate-400"></i> ${driver.vehiculo}</span>
                  <span class="bg-slate-200 dark:bg-slate-950 text-slate-700 dark:text-slate-300 font-mono text-[10px] px-1.5 py-0.5 rounded border border-slate-300 dark:border-slate-800">${driver.placa}</span>
                </p>
              </div>
            </div>
            ${statusBadge}
          </div>

          <!-- Métricas -->
          <div class="grid grid-cols-3 gap-2 my-3 py-2 px-3 bg-white dark:bg-slate-950/60 rounded-xl border border-slate-200 dark:border-slate-800/50 text-center">
            <div>
              <span class="text-[10px] uppercase font-semibold text-slate-400 block">Zona</span>
              <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 truncate block">${driver.zona}</span>
            </div>
            <div>
              <span class="text-[10px] uppercase font-semibold text-slate-400 block">Calificación</span>
              <span class="text-xs font-bold text-amber-500 flex items-center justify-center gap-1">
                <i class="fa-solid fa-star text-[10px]"></i> ${Number(driver.calificacion).toFixed(1)} <span class="text-[10px] text-slate-400 font-normal">(${driver.resenasCount})</span>
              </span>
            </div>
            <div>
              <span class="text-[10px] uppercase font-semibold text-slate-400 block">Carreras</span>
              <span class="text-xs font-semibold text-slate-700 dark:text-slate-200 block">${driver.carreras}+</span>
            </div>
          </div>

          <!-- Comentario Destacado -->
          <div class="text-[11px] text-slate-500 dark:text-slate-400 bg-white dark:bg-slate-950/30 p-2 rounded-lg italic border-l-2 border-brand-500 mb-3.5 flex items-center justify-between">
            <span class="truncate">"${driver.comentarioDestacado || 'Sin reseñas aún'}"</span>
            <button onclick="openRatingModal('${driver.id}')" class="text-[10px] text-brand-600 dark:text-brand-500 font-semibold not-italic hover:underline ml-2 shrink-0">
              Calificar
            </button>
          </div>

          <!-- Botón WhatsApp -->
          <a href="${linkWA}" target="_blank" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 via-brand-600 to-teal-600 hover:opacity-95 text-slate-950 font-extrabold rounded-xl text-xs flex items-center justify-center space-x-2 transition-all shadow-md active:scale-[0.98]">
            <i class="fa-brands fa-whatsapp text-sm text-slate-950"></i>
            <span>Pedir Delivery por WhatsApp</span>
          </a>
        `;

        contenedor.appendChild(card);
      });
    }

    // FILTRADO
    function filtrarRepartidores() {
      const zonaSeleccionada = document.getElementById('zonaSelect').value;
      const soloDisponibles = document.getElementById('disponiblesToggle').checked;

      let flota = obtenerRepartidoresFlota();

      if (zonaSeleccionada !== 'todas') {
        flota = flota.filter(r => r.zona === zonaSeleccionada);
      }

      if (soloDisponibles) {
        flota = flota.filter(r => r.enLinea);
      }

      renderRepartidores(flota);
    }

    // MODAL CALIFICAR
    function openRatingModal(driverId) {
      selectedDriverId = driverId;
      const flota = obtenerRepartidoresFlota();
      const driver = flota.find(r => r.id === driverId);
      if(!driver) return;

      document.getElementById('modalDriverName').innerText = driver.nombre;
      document.getElementById('modalDriverAvatar').innerText = driver.avatarIcon || '🛵';
      document.getElementById('ratingComment').value = '';
      setRating(5);

      const modal = document.getElementById('ratingModal');
      const card = document.getElementById('ratingModalCard');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('translate-y-full');
      }, 10);
    }

    function closeRatingModal() {
      const modal = document.getElementById('ratingModal');
      const card = document.getElementById('ratingModalCard');
      card.classList.add('translate-y-full');
      modal.classList.add('opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    function setRating(val) {
      currentRating = val;
      const buttons = document.querySelectorAll('#starContainer .star-btn');
      buttons.forEach((btn, index) => {
        if (index < val) {
          btn.classList.remove('text-slate-300', 'dark:text-slate-700');
          btn.classList.add('text-amber-400');
        } else {
          btn.classList.remove('text-amber-400');
          btn.classList.add('text-slate-300', 'dark:text-slate-700');
        }
      });
    }

    function enviarCalificacionReal() {
      let flota = obtenerRepartidoresFlota();
      const driverIndex = flota.findIndex(r => r.id === selectedDriverId);
      
      if(driverIndex !== -1) {
        const driver = flota[driverIndex];
        const comentarioTexto = document.getElementById('ratingComment').value.trim();

        const totalPuntos = (driver.calificacion * driver.resenasCount) + currentRating;
        driver.resenasCount += 1;
        driver.calificacion = Number((totalPuntos / driver.resenasCount).toFixed(1));
        
        if(comentarioTexto) {
          driver.comentarioDestacado = comentarioTexto;
        }

        guardarFlota(flota);
        showToast(`¡Reseña guardada para ${driver.nombre}! ⭐`);
      }

      closeRatingModal();
      filtrarRepartidores();
    }

    function sincronizarFlota() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('animate-spin');
      setTimeout(() => {
        btn.classList.remove('animate-spin');
        filtrarRepartidores();
        showToast('Flota sincronizada en vivo');
      }, 500);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('-translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('-translate-y-20', 'opacity-0');
      }, 2500);
    }

    window.onload = function() {
      initTheme();
      filtrarRepartidores();
    };
  </script>
</body>
</html>
