<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Repartidores Activos | Clientes</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-slate-950 pb-12 transition-colors duration-300">

  <!-- Header -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/60 backdrop-blur-xl sticky top-0 z-50 px-4 py-3.5">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-400 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20 ring-2 ring-emerald-500/30">
          🛍️
        </div>
        <div>
          <h1 class="font-bold text-slate-900 dark:text-white text-base tracking-tight leading-none">Directorio Clientes</h1>
          <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold tracking-wide uppercase">Repartidores en Turno Real</span>
        </div>
      </div>
      
      <!-- Botón Modo Oscuro / Claro -->
      <button onclick="toggleTheme()" class="p-2.5 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900/90 shadow-sm cursor-pointer focus:outline-none" title="Cambiar Tema">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal: Directorio de Repartidores -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">🛵 Motorizados Disponibles Ahora</h2>
      <button onclick="cargarDirectorioRepartidores()" class="text-[10px] px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold rounded-lg border border-emerald-500/30 transition cursor-pointer">
        🔄 Actualizar Lista
      </button>
    </div>

    <!-- Contenedor donde se inyectan los repartidores activos -->
    <div id="lista-repartidores-clientes" class="space-y-3">
      <!-- Se llena dinámicamente -->
    </div>
  </main>

  <!-- SCRIPT DE SINCRONIZACIÓN -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerText = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        icon.innerText = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    (function() {
      const savedTheme = localStorage.getItem('theme');
      const icon = document.getElementById('theme-icon');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        if(icon) icon.innerText = '🌙';
      } else {
        document.documentElement.classList.add('dark');
        if(icon) icon.innerText = '☀️';
      }
    })();

    // LÓGICA DE ENLACE DIRECTO CON LA CUENTA DE REPARTIDOR
    function cargarDirectorioRepartidores() {
      const contenedor = document.getElementById('lista-repartidores-clientes');
      contenedor.innerHTML = '';

      let flota = [];

      // 1. Verificamos si hay una sesión Pro activa con turno encendido en el cotizador
      const sesionProActiva = JSON.parse(localStorage.getItem('repartidor_pro_session'));
      if (sesionProActiva && sesionProActiva.enLinea) {
        flota.push(sesionProActiva);
      }

      // 2. También buscamos en la base general de la flota por si hay más
      const flotaGeneral = JSON.parse(localStorage.getItem('flota_repartidores')) || [];
      flotaGeneral.forEach(rep => {
        // Evitar duplicados si ya está el de la sesión activa
        if (rep.enLinea && !flota.some(item => item.id === rep.id)) {
          flota.push(rep);
        }
      });

      if (flota.length === 0) {
        contenedor.innerHTML = `
          <div class="p-8 text-center bg-white dark:bg-slate-900/80 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-2">
            <span class="text-3xl">☕</span>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">No hay repartidores en turno activo</p>
            <p class="text-[11px] text-slate-500">Enciende tu interruptor en la app de repartidor para aparecer aquí.</p>
          </div>
        `;
        return;
      }

      // Pintamos cada repartidor activo con sus datos reales
      flota.forEach(rep => {
        const card = document.createElement('div');
        card.className = 'p-4 bg-white dark:bg-slate-900/90 rounded-3xl border border-emerald-500/30 space-y-3 shadow-xl backdrop-blur-xl';
        
        // Manejar el icono o foto de perfil guardada
        let avatarHTML = `<div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-400 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-emerald-500/20 overflow-hidden">🛵</div>`;
        if (rep.avatarIcon) {
          if (rep.avatarIcon.startsWith('<img') || rep.avatarIcon.startsWith('data:')) {
            avatarHTML = `<div class="w-12 h-12 rounded-2xl overflow-hidden shadow-lg shadow-emerald-500/20 ring-2 ring-emerald-500/30">${rep.avatarIcon.startsWith('data:') ? `<img src="${rep.avatarIcon}" style="width:100%;height:100%;object-fit:cover;">` : rep.avatarIcon}</div>`;
          }
        }

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              ${avatarHTML}
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-sm">${rep.nombre}</h3>
                <p class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold uppercase tracking-wider">📍 Zona: ${rep.zona || 'San Diego'}</p>
              </div>
            </div>
            <span class="px-2.5 py-1 bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 rounded-full text-[10px] font-black border border-emerald-500/30 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> EN TURNO
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 dark:bg-slate-950 p-2.5 rounded-2xl border border-slate-200 dark:border-slate-800">
            <div>
              <p class="text-[9px] text-slate-400 uppercase font-bold">Vehículo / Moto:</p>
              <p class="font-semibold text-slate-700 dark:text-slate-300">🏍️ ${rep.vehiculo || 'Bera Socialista 150'}</p>
            </div>
            <div>
              <p class="text-[9px] text-slate-400 uppercase font-bold">Placa Verificada (KYC):</p>
              <p class="font-semibold text-slate-700 dark:text-slate-300">🛡️ ${rep.placa || 'N/A'}</p>
            </div>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <a href="https://api.whatsapp.com/send?phone=${rep.whatsapp || '584120000000'}&text=${encodeURIComponent('¡Hola ' + rep.nombre + '! Vi tu perfil en el directorio y necesito un servicio de delivery.')}" 
               target="_blank" rel="noopener noreferrer" 
               class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl text-center flex items-center justify-center gap-2 shadow-lg shadow-emerald-500/20 text-xs transition">
              <i class="fa-brands fa-whatsapp text-base"></i> Contactar por WhatsApp
            </a>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Cargar al iniciar la página
    cargarDirectorioRepartidores();
    
    // Auto-refrescar cada 5 segundos para mantener la sincronización en tiempo real
    setInterval(cargarDirectorioRepartidores, 5000);
  </script>
</body>
</html>
