<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directorio de Repartidores Activos | Clientes</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans selection:bg-emerald-500 selection:text-slate-950 pb-12 transition-colors duration-300">

  <!-- Header Estilizado -->
  <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/80 dark:bg-slate-900/60 backdrop-blur-xl sticky top-0 z-50 px-4 py-3.5 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-400 flex items-center justify-center font-black text-slate-950 text-lg shadow-lg shadow-emerald-500/20 ring-2 ring-emerald-500/30">
          🛍️
        </div>
        <div>
          <h1 class="font-bold text-slate-900 dark:text-white text-base tracking-tight leading-none">Directorio Clientes</h1>
          <span class="text-[10px] text-emerald-600 dark:text-emerald-400 font-semibold tracking-wide uppercase">Repartidores en Turno Real</span>
        </div>
      </div>
      
      <!-- Botón Modo Oscuro / Claro -->
      <button onclick="toggleTheme()" class="p-2.5 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900/90 shadow-sm cursor-pointer focus:outline-none" title="Cambiar Tema">
        <span id="theme-icon">☀️</span>
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-4">
    <div class="flex items-center justify-between">
      <h2 class="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
        <i class="fa-solid fa-motorcycle text-emerald-500"></i> Motorizados Disponibles
      </h2>
      <button onclick="cargarDirectorioRepartidores()" class="text-[10px] px-3 py-1.5 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 font-bold rounded-xl border border-emerald-500/30 transition cursor-pointer flex items-center gap-1.5 focus:outline-none">
        🔄 Actualizar
      </button>
    </div>

    <!-- Contenedor dinámico de repartidores -->
    <div id="lista-repartidores-clientes" class="space-y-3">
      <!-- Se inyectan las tarjetas activas -->
    </div>
  </main>

  <!-- Script de Lectura en Tiempo Real -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        icon.innerText = '🌙';
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        icon.innerText = '☀️';
        localStorage.setItem('theme', 'dark');
      }
    }

    (function() {
      const savedTheme = localStorage.getItem('theme');
      const icon = document.getElementById('theme-icon');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        if(icon) icon.innerText = '🌙';
      } else {
        document.documentElement.classList.add('dark');
        if(icon) icon.innerText = '☀️';
      }
    })();

    function cargarDirectorioRepartidores() {
      const contenedor = document.getElementById('lista-repartidores-clientes');
      contenedor.innerHTML = '';

      let flota = [];
      let sesionProActiva = JSON.parse(localStorage.getItem('repartidor_pro_session'));

      // Verificar si hay sesión Pro activa con turno habilitado
      if (sesionProActiva && sesionProActiva.enLinea) {
        if (sesionProActiva.id) {
          const uidPartes = sesionProActiva.id.replace('rep_', '');
          
          // Leer credenciales vivas actualizadas desde las claves individuales del repartidor
          const marcaReal = localStorage.getItem(`marca_${uidPartes}`);
          const placaReal = localStorage.getItem(`placa_${uidPartes}`);
          const vehiculoReal = localStorage.getItem(`vehiculo_${uidPartes}`);
          const zonaReal = localStorage.getItem(`zona_${uidPartes}`);
          const wppReal = localStorage.getItem(`whatsapp_${uidPartes}`);
          const avatarReal = localStorage.getItem(`avatar_${uidPartes}`);

          if (marcaReal) sesionProActiva.nombre = marcaReal;
          if (placaReal) sesionProActiva.placa = placaReal;
          if (vehiculoReal) sesionProActiva.vehiculo = vehiculoReal;
          if (zonaReal) sesionProActiva.zona = zonaReal;
          if (wppReal) sesionProActiva.whatsapp = wppReal;
          if (avatarReal) sesionProActiva.avatarBase64 = avatarReal;
        }
        flota.push(sesionProActiva);
      }

      // Validar respaldo en el listado general de flota si existen más unidades
      const flotaGeneral = JSON.parse(localStorage.getItem('flota_repartidores')) || [];
      flotaGeneral.forEach(rep => {
        if (rep.enLinea && !flota.some(item => item.id === rep.id)) {
          // Intentar actualizar también la información de la flota general
          if (rep.id) {
            const uidPartes = rep.id.replace('rep_', '');
            const marcaReal = localStorage.getItem(`marca_${uidPartes}`);
            const placaReal = localStorage.getItem(`placa_${uidPartes}`);
            const vehiculoReal = localStorage.getItem(`vehiculo_${uidPartes}`);
            const zonaReal = localStorage.getItem(`zona_${uidPartes}`);
            const wppReal = localStorage.getItem(`whatsapp_${uidPartes}`);
            const avatarReal = localStorage.getItem(`avatar_${uidPartes}`);

            if (marcaReal) rep.nombre = marcaReal;
            if (placaReal) rep.placa = placaReal;
            if (vehiculoReal) rep.vehiculo = vehiculoReal;
            if (zonaReal) rep.zona = zonaReal;
            if (wppReal) rep.whatsapp = wppReal;
            if (avatarReal) rep.avatarBase64 = avatarReal;
          }
          flota.push(rep);
        }
      });

      // Estado sin repartidores activos
      if (flota.length === 0) {
        contenedor.innerHTML = `
          <div class="p-8 text-center bg-white dark:bg-slate-900/80 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-3 shadow-xl backdrop-blur-xl">
            <div class="w-12 h-12 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center mx-auto text-xl">☕</div>
            <div class="space-y-1">
              <p class="text-xs font-bold text-slate-800 dark:text-slate-200">No hay repartidores en turno activo</p>
              <p class="text-[11px] text-slate-500">Enciende tu interruptor Pro en la app de repartidor para aparecer en tiempo real.</p>
            </div>
          </div>
        `;
        return;
      }

      // Renderizar tarjetas con los datos reales entrelazados
      flota.forEach(rep => {
        const card = document.createElement('div');
        card.className = 'p-5 bg-white dark:bg-slate-900/90 rounded-3xl border border-emerald-500/30 space-y-4 shadow-2xl backdrop-blur-xl transition-all';
        
        // Renderizado inteligente del Avatar / Foto
        let avatarHTML = `<div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-cyan-400 flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-emerald-500/20 shrink-0">🛵</div>`;
        if (rep.avatarBase64) {
          avatarHTML = `<div class="w-12 h-12 rounded-2xl overflow-hidden shadow-lg shadow-emerald-500/20 ring-2 ring-emerald-500/30 shrink-0"><img src="${rep.avatarBase64}" style="width:100%;height:100%;object-fit:cover;"></div>`;
        } else if (rep.avatarIcon && rep.avatarIcon.includes('<img')) {
          avatarHTML = `<div class="w-12 h-12 rounded-2xl overflow-hidden shadow-lg shadow-emerald-500/20 ring-2 ring-emerald-500/30 shrink-0">${rep.avatarIcon}</div>`;
        }

        // Formateo y limpieza del número telefónico de WhatsApp (Estructura Venezuela +58)
        let tlfLimpio = (rep.whatsapp || '584120000000').replace(/\D/g, '');
        if (tlfLimpio.startsWith('0')) {
          tlfLimpio = '58' + tlfLimpio.substring(1);
        } else if (!tlfLimpio.startsWith('58')) {
          tlfLimpio = '58' + tlfLimpio;
        }

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800/80 pb-3">
            <div class="flex items-center gap-3.5">
              ${avatarHTML}
              <div>
                <h3 class="font-bold text-slate-900 dark:text-white text-sm tracking-tight">${rep.nombre || 'Repartidor Pro'}</h3>
                <p class="text-[10px] text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider mt-0.5">📍 Zona: ${rep.zona || 'San Diego'}</p>
              </div>
            </div>
            <span class="px-3 py-1 bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 rounded-full text-[10px] font-black border border-emerald-500/30 flex items-center gap-1.5 shadow-sm">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> EN TURNO
            </span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800/80">
            <div>
              <p class="text-[9px] text-slate-400 uppercase font-extrabold tracking-wider">Vehículo / Moto:</p>
              <p class="font-bold text-slate-700 dark:text-slate-200 mt-0.5">🏍️ ${rep.vehiculo || 'Bera Socialista 150'}</p>
            </div>
            <div>
              <p class="text-[9px] text-slate-400 uppercase font-extrabold tracking-wider">Placa Verificada (KYC):</p>
              <p class="font-bold text-slate-700 dark:text-slate-200 mt-0.5">🛡️ ${rep.placa || 'N/A'}</p>
            </div>
          </div>

          <div>
            <a href="https://api.whatsapp.com/send?phone=${tlfLimpio}&text=${encodeURIComponent('¡Hola ' + (rep.nombre || 'Repartidor') + '! Vi tu perfil en el directorio de clientes y necesito cotizar un delivery.')}" 
               target="_blank" rel="noopener noreferrer" 
               class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-2xl text-center flex items-center justify-center gap-2.5 shadow-lg shadow-emerald-500/25 text-xs transition-all focus:outline-none">
              <i class="fa-brands fa-whatsapp text-base"></i> Contactar por WhatsApp
            </a>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    // Cargar inmediatamente y mantener actualización automática cada 3 segundos en tiempo real
    cargarDirectorioRepartidores();
    setInterval(cargarDirectorioRepartidores, 3000);
  </script>
</body>
</html>
